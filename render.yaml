services:
  - type: web
    name: keshihua
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: keshihua-db
          property: connectionString

databases:
  - name: keshihua-db
    plan: free
